services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saudememora-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      PORT: 8080
      MONGODB_CONNECTION_STRING: mongodb://mongo:27017
      MONGODB_DATABASE_NAME: saudeMemora
      REDIS_CONNECTION_STRING: redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no ambiente (openssl rand -base64 48)}
      JWT_ISSUER: saude-memora
      JWT_AUDIENCE: saude-memora
      JWT_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Origens dinâmicas (previews). Vazio = apenas a allowlist exata acima.
      CORS_ALLOWED_ORIGIN_PATTERNS: ""
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      GEMINI_INPUT_PRICE_PER_MILLION: ${GEMINI_INPUT_PRICE_PER_MILLION:-}
      GEMINI_OUTPUT_PRICE_PER_MILLION: ${GEMINI_OUTPUT_PRICE_PER_MILLION:-}
      GEMINI_REPORT_INPUT_TOKEN_BUDGET: ${GEMINI_REPORT_INPUT_TOKEN_BUDGET:-12000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_CHAT_TOOL_CALLING_ENABLED: ${GROQ_CHAT_TOOL_CALLING_ENABLED:-true}
      GROQ_CHAT_INPUT_TOKEN_BUDGET: ${GROQ_CHAT_INPUT_TOKEN_BUDGET:-12000}
      GROQ_CHAT_OUTPUT_TOKEN_LIMIT: ${GROQ_CHAT_OUTPUT_TOKEN_LIMIT:-800}
      GROQ_INPUT_PRICE_PER_MILLION: ${GROQ_INPUT_PRICE_PER_MILLION:-}
      GROQ_OUTPUT_PRICE_PER_MILLION: ${GROQ_OUTPUT_PRICE_PER_MILLION:-}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      BREVO_API_KEY: ""
      BREVO_FROM_EMAIL: nao-responda@saudememora.com.br
      TRUSTED_PROXIES: ""
      # Processamento em segundo plano
      DOCUMENT_WORKER_CONCURRENCY: "3"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      PUBLIC_API_URL: ""
      # Validade do token da ficha de emergência, em horas (padrão 12).
      EMERGENCIA_TOKEN_HORAS_EXPIRACAO: "12"
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: saudememora-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: saudeMemora
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: saudememora-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
  redis_data:
